name: Maizon FakeMote Universal experimental Starlet build
on:
  push:
    branches:
      - feature/maizon-fakemote-universal
    paths:
      - 'fakemote-universal/**'
      - '.github/workflows/maizon-fakemote.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starlet:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and verify Maizon HID patch sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/maizon-patch
          cat fakemote-universal/packed/part*.b64 | tr -d '\n\r' | base64 -d > /tmp/maizon-patch.tar.xz
          echo "e12b9707bb463d01829fc145bcd468ddb5f78ebf8d33309fd6546686436e000f  /tmp/maizon-patch.tar.xz" | sha256sum -c -
          tar -xJf /tmp/maizon-patch.tar.xz -C /tmp/maizon-patch
          test -f /tmp/maizon-patch/tools/prepare_fakemote.py
      - name: Setup build tools
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y git ca-certificates python3 wget g++ ninja-build xz-utils
          wget -q https://github.com/Kitware/CMake/releases/download/v4.0.2/cmake-4.0.2-linux-x86_64.sh -O /tmp/cmake-install.sh
          chmod +x /tmp/cmake-install.sh
          /tmp/cmake-install.sh --skip-license --prefix=/usr/local
          wget -q https://raw.githubusercontent.com/Leseratte10/d2xl-cios/master/stripios/main.cpp -O /tmp/stripios.cpp
          g++ -O2 /tmp/stripios.cpp -o /usr/local/bin/stripios
          echo "$DEVKITPRO/devkitARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"
          export PATH="$DEVKITPRO/devkitARM/bin:$DEVKITPRO/tools/bin:$PATH"
          test -x "$DEVKITPRO/devkitARM/bin/arm-none-eabi-gcc"
          command -v arm-none-eabi-gcc
          command -v stripios
          cmake --version
      - name: Fetch upstream sources and Nintendont profiles
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recursive --depth=1 https://github.com/xerpi/fakemote.git /tmp/fakemote
          git clone --depth=1 --filter=blob:none --sparse https://github.com/FIX94/Nintendont.git /tmp/Nintendont
          git -C /tmp/Nintendont sparse-checkout set controllerconfigs
          # Fakemote main currently uses tabs for button maps; patcher expects spaces.
          python3 -c 'from pathlib import Path; p=Path("/tmp/fakemote/source/input_device.c"); p.write_text(p.read_text().expandtabs(4))'
          python3 /tmp/maizon-patch/tools/prepare_fakemote.py /tmp/fakemote /tmp/Nintendont/controllerconfigs
          python3 fakemote-universal/v04/upgrade.py /tmp/fakemote
      - name: Smoke-test real generated 0810:0001 profile and USB descriptor
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/maizon_smoke.c <<'EOF'
          #include "nin_hid.h"
          #include "nin_profiles_generated.h"
          #include "nin_usb_desc.h"
          #include <assert.h>
          #include <stdio.h>
          int main(void) {
              const nin_profile_t *p = nin_find_profile(nin_profiles, NIN_PROFILE_COUNT, 0x0810, 0x0001);
              assert(p != NULL);
              unsigned char report[7] = {1,128,128,128,128,0x20,0x20};
              nin_input_t got = {0};
              assert(nin_decode(p, report, sizeof(report), &got));
              assert(got.buttons & (1u << NIN_A));
              assert(got.buttons & (1u << NIN_UP));
              assert(got.buttons & (1u << NIN_START));
              assert(nin_usb_interrupt_in_endpoint(NULL, 0) == 0x81);
              unsigned char usb[96] = {0};
              usb[36]=18;usb[37]=1;
              usb[56]=9;usb[57]=2;
              usb[68]=9;usb[69]=4;usb[73]=3;
              usb[80]=7;usb[81]=5;usb[82]=0x82;usb[83]=3;
              assert(nin_usb_interrupt_in_endpoint(usb, sizeof usb) == 0x82);
              puts("PASS: Nintendont 0810:0001 + endpoint descriptor");
              return 0;
          }
          EOF
          cc -std=c11 -O1 -Wall -Wextra -Werror -pedantic \
            -I/tmp/fakemote/embedded-game-controller/embedded-game-controller/usb_drivers \
            /tmp/fakemote/embedded-game-controller/embedded-game-controller/usb_drivers/nin_hid.c \
            /tmp/fakemote/embedded-game-controller/embedded-game-controller/usb_drivers/nin_usb_desc.c \
            /tmp/maizon_smoke.c -o /tmp/maizon_smoke
          /tmp/maizon_smoke
      - name: Compile Starlet module
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S /tmp/fakemote -B /tmp/fakemote/build/Release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/devkitARM.cmake"
          cmake --build /tmp/fakemote/build/Release --parallel 2
          test -s /tmp/fakemote/build/Release/FAKEMOTE.app
          sha256sum /tmp/fakemote/build/Release/FAKEMOTE.app
      - name: Upload experimental FAKEMOTE.app (NOT A WAD)
        uses: actions/upload-artifact@v4
        with:
          name: Maizon_FakeMote_Universal_Experimental_APP
          path: /tmp/fakemote/build/Release/FAKEMOTE.app
          if-no-files-found: error
