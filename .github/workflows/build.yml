name: Wii2GameCube PowerPC DOL and guest scene CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test DOL, guest gate and independent Wii scene ABI
        run: python -m unittest discover -s tests -v
      - name: Check Python source
        run: python -m compileall -q tools tests
  homebrew-build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20260503
    steps:
      - uses: actions/checkout@v4
      - name: Expose devkitPPC compiler tools to PATH
        run: echo "${DEVKITPPC}/bin" >> "$GITHUB_PATH"
      - name: Build original Wii-target function guest
        run: make -C guest_probe all
      - name: Validate original Wii guest PPC and DOL
        run: |
          python3 tools/guest_gate.py guest_probe/guest.o guest_probe/guest.bin
          python3 tools/dol_inspect.py guest_probe/guest.dol --strict
      - name: Build Wii-target scene command DOL
        run: make -C guest_scene all
      - name: Gate scene PPC relocations and check DOL
        run: |
          python3 tools/guest_gate.py guest_scene/scene.o guest_scene/scene.bin
          python3 tools/dol_inspect.py guest_scene/scene.dol --strict
          python3 tools/pack_guest_dol.py guest_scene/scene.bin /tmp/scene-check.dol
          cmp /tmp/scene-check.dol guest_scene/scene.dol
      - name: Assert deterministic original DOL
        run: |
          python3 tools/pack_guest_dol.py guest_probe/guest.bin /tmp/guest-check.dol
          cmp /tmp/guest-check.dol guest_probe/guest.dol
      - name: Build GameCube host with two embedded Wii guests
        run: make -C gamecube_probe all
      - name: Build independent Wii reference homebrew
        run: make -C wii_sample all
      - name: Verify all executables and payloads
        run: |
          test -s gamecube_probe/gcwcl_probe.dol
          test -s guest_probe/guest.dol
          test -s guest_scene/scene.dol
          test -s wii_sample/wii_guest_sample.dol
          ls -lh gamecube_probe/gcwcl_probe.dol guest_probe/guest.dol guest_scene/scene.dol wii_sample/wii_guest_sample.dol
      - name: Upload proof programs (not universal Wii compatibility)
        uses: actions/upload-artifact@v4
        with:
          name: wii2gamecube-phase3-guest-scene
          path: |
            gamecube_probe/gcwcl_probe.dol
            guest_probe/guest.dol
            guest_scene/scene.dol
            wii_sample/wii_guest_sample.dol
          if-no-files-found: error

  dolphin-visual-smoke:
    name: Dolphin GameCube runtime screenshot proof
    runs-on: ubuntu-26.04
    needs: homebrew-build
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wii2gamecube-phase3-guest-scene
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dolphin emulator and virtual X11 display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dolphin-emu xvfb imagemagick libgl1-mesa-dri
          python -m pip install 'Pillow>=10,<14'
          command -v dolphin-emu
          dolphin-emu --version
      - name: Run GC executable and verify visible Wii guest sprites
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            python tools/dolphin_smoke.py gamecube_probe/gcwcl_probe.dol \
            --seconds 35 --artifacts dolphin-evidence
      - name: Upload Dolphin screenshot and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dolphin-visual-evidence
          path: dolphin-evidence/
          if-no-files-found: warn
